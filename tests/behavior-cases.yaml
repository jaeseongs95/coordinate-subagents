{
  "schema_version": 2,
  "policy_contracts": {
    "authority.inherit-mode": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Apply instruction priority"},
    "delegation.atomic-local": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Decide whether to delegate"},
    "delegation.explicit-request": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Decide whether to delegate"},
    "delegation.independent-parallel": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Decide whether to delegate"},
    "delegation.allowed-exceptions": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Decide whether to delegate"},
    "preferences.ask-once": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Resolve the delegation preference"},
    "allocation.keep-one-and-fill-slots": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Assign work"},
    "allocation.batch-reuse": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Assign work"},
    "allocation.explicit-single-delegation-playbook": {"source": "skills/coordinate-subagents/references/delegation-playbook.md", "section": "Batch and synchronize"},
    "ownership.single-writer": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Assign work"},
    "integration.no-redo": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Coordinate and integrate"},
    "audit.independent-required": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Require independent audits for high-risk work"},
    "audit.reserve-identity": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Assign work"},
    "audit.reserve-identity-playbook": {"source": "skills/coordinate-subagents/references/delegation-playbook.md", "section": "Batch and synchronize"},
    "audit.no-completion-without-auditor": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Require independent audits for high-risk work"},
    "audit.reaudit-after-change": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Require independent audits for high-risk work"},
    "audit.finding-disposition": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Require independent audits for high-risk work"},
    "completion.current-evidence": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Complete the task"},
    "completion.report-facts": {"source": "skills/coordinate-subagents/SKILL.md", "section": "Complete the task"},
    "dispatch.inspect-and-recover": {"source": "skills/coordinate-subagents/references/delegation-playbook.md", "section": "Recover from dispatch problems"},
